# AlertManager Configuration for Loaffinity Blockchain
# =====================================================

global:
  # The smarthost and SMTP sender used for mail notifications
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alertmanager@loaffinity.com'
  # smtp_auth_username: 'alertmanager'
  # smtp_auth_password: 'password'

  # Slack webhook URL (uncomment and configure)
  # slack_api_url: 'https://hooks.slack.com/services/xxx/xxx/xxx'

  # Global resolve timeout
  resolve_timeout: 5m

# The root route - all alerts enter here
route:
  # Group alerts by these labels
  group_by: ['alertname', 'node_name', 'severity']

  # Wait time before sending first notification for new group
  group_wait: 30s

  # Wait time before sending notification about new alerts in existing group
  group_interval: 5m

  # Wait time before resending a notification
  repeat_interval: 4h

  # Default receiver
  receiver: 'default-receiver'

  # Child routes for specific routing
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 4h

    # Info alerts - less urgent
    - match:
        severity: info
      receiver: 'default-receiver'
      group_wait: 5m
      repeat_interval: 12h

# Inhibition rules - suppress alerts when more severe alerts exist
inhibit_rules:
  # If a node is down, suppress all other alerts from that node
  - source_match:
      alertname: 'BesuNodeDown'
    target_match_re:
      alertname: '.*'
    equal: ['node_name']

  # If out of sync, suppress transaction pool alerts
  - source_match:
      alertname: 'BesuNodeOutOfSync'
    target_match:
      alertname: 'BesuTxPoolHigh'
    equal: ['node_name']

# Receivers define notification channels
receivers:
  # Default receiver - logs only (for development)
  - name: 'default-receiver'
    # For development, just log to AlertManager
    # Add webhook/email/slack config for production

  # Critical alerts receiver
  - name: 'critical-receiver'

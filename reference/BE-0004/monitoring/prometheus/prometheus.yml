# Prometheus Configuration for Loaffinity Blockchain Stack
# =========================================================

global:
  scrape_interval: 15s      # How frequently to scrape targets
  evaluation_interval: 15s  # How frequently to evaluate rules
  scrape_timeout: 10s       # Timeout for scrape requests

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    cluster: 'loaffinity-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load and evaluate rules from these files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # =====================
  # Prometheus Self-Monitoring
  # =====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # =====================
  # Blockscout Services
  # =====================
  - job_name: 'blockscout-backend'
    metrics_path: '/public-metrics'
    static_configs:
      - targets: ['blockscout-backend:4000']
        labels:
          service: 'blockscout-backend'
          component: 'api'

  - job_name: 'blockscout-indexer'
    metrics_path: '/public-metrics'
    static_configs:
      - targets: ['blockscout-indexer:4000']
        labels:
          service: 'blockscout-indexer'
          component: 'indexer'

  - job_name: 'blockscout-stats'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['stats:9090']
        labels:
          service: 'blockscout-stats'
          component: 'stats'

  - job_name: 'blockscout-smart-contract-verifier'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['smart-contract-verifier:6060']
        labels:
          service: 'smart-contract-verifier'
          component: 'verifier'

  # =====================
  # PostgreSQL (using postgres_exporter)
  # =====================
  # Uncomment after adding postgres-exporter service
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         database: 'blockscout'

  # =====================
  # Node Exporter (Host Metrics)
  # =====================
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # =====================
  # Docker/Container Metrics (cAdvisor)
  # =====================
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "http://mimir:9009/api/v1/push"
